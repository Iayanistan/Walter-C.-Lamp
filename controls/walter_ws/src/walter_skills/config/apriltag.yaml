# apriltag_ros (christianrauch) settings for the scene camera.
# size = edge of the BLACK square in metres. Measure your prints with calipers and fix these.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.040
    max_hamming: 0
    detector:
      threads: 2
      decimate: 2.0      # faster; set 1.0 if small or distant tags drop out
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    # Only these ids are reported, with these TF frame names (placement_checker expects tag_<id>).
    tag:
      ids:    [0, 1, 2, 3, 4]
      frames: [tag_0, tag_1, tag_2, tag_3, tag_4]
      sizes:  [0.060, 0.040, 0.040, 0.040, 0.040]   # tag 0 is the larger bench reference
